spring:
  application:
    name: spring-ai-integration-starter
  ai:
    model:
      chat: ollama
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5:1.5b
          temperature: 0.3
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  port: ${PORT:8080}
